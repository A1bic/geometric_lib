name: "Tests on push"
on:
  push:
    branches:
      - 'labwork_4'

jobs:
  run_tests_ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 
        uses: actions/setup-python@v5
      - name: Run all tests Ubuntu-latest
        run: python3 -m unittest
  run_tests_windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 
        uses: actions/setup-python@v5
      - name: Run all tests Windows-latest
        run: python -m unittest
